 }

 buildLevel(i){
  const lv=this.lv=LEVELS[i];this.lvIdx=i;
  this.world.forEach(o=>o.destroy());this.world=[];
  const add=o=>{this.world.push(o);return o};
  add(this.add.rectangle(W/2,H/2,W,H,lv.bg));
  const cols=W/TS,rows=H/TS;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const edge=r===0||c===0||r===rows-1||c===cols-1;
   const k=edge?'dirt':'g'+(1+((c*7+r*13)%4));
   const im=add(this.add.image(c*TS+TS/2,r*TS+TS/2,k).setDisplaySize(TS,TS).setTint(lv.tint));
   if(!edge&&((c+r)%3===0))im.setAngle(90*((c*r)%4));
  }
  if(lv.ov)add(this.add.rectangle(W/2,H/2,W,H,lv.ov,lv.ova).setDepth(1));
  const v=add(this.add.graphics().setDepth(5000));
  v.lineStyle(70,0x000000,.18+lv.fog*.5);v.strokeRect(-20,-20,W+40,H+40);
  v.lineStyle(4,0x1c120a,.7);v.strokeRect(PAD,PAD,W-2*PAD,H-2*PAD);
  if(lv.fog){const f=add(this.add.rectangle(W/2,H/2,W,H,0x000a14,lv.fog*.55).setDepth(4900))}
  this.makeObstacles(i);
 }
 makeObstacles(li){
  this.obs=[];
  const lv=LEVELS[li],R=rngf(li*977+13);
  const rnd=(a,b)=>a+Math.floor(R()*(b-a+1));
  const types=lv.types.map((t,j)=>[t,[.95,.9,.8,.95][j%4],[24,22,20,24][j%4]]);
  let tries=0;
  while(this.obs.length<lv.obs&&tries++<800){
   const t=types[this.obs.length%types.length];
   const x=rnd(PAD+50,W-PAD-50),y=rnd(PAD+110,H-PAD-70);
   if(Phaser.Math.Distance.Between(x,y,START.x,START.y)<150)continue;
   if(this.obs.some(o=>Phaser.Math.Distance.Between(x,y,o.x,o.y)<100))continue;
   const sh=this.add.ellipse(x+4,y+t[2]*.6,t[2]*2,t[2]*.9,0,.28).setDepth(y-1);
   const im=this.add.image(x,y,t[0]).setScale(t[1]*1.2).setDepth(y+t[2]*.3).setAngle(rnd(0,3)*90);
   this.world.push(sh,im);
   this.obs.push({x,y,r:t[2]*.95,im,sh});
  }
 }

  c.add(this.txt(W/2,390,'شبح نفسك',84,'#ffffff'));
  c.add(this.txt(W/2,462,'اهرب من نفسك!',34,'#9ff0ff'));
  const steps=['1  اسحب صباعك على الشاشة عشان تتحرك','2  اجمع الجواهر الزرقا عشان تعدّي المرحلة','3  حركتك بتبقى شبح بيجري وراك','4  لو لمسك شبح ابدأ المرحلة من الأول'];
  steps.forEach((s,i)=>c.add(this.txt(W-50,540+i*58,s,22,'#ffffff',{ox:1,style:{wordWrap:{width:W-100}}})));
  const btn=this.add.rectangle(W/2,780,330,96,0xffc93a).setStrokeStyle(6,0x8a5a00).setInteractive({useHandCursor:true});
  const bt=this.txt(W/2,780,this.prog&&this.prog.seen?'كمّل المغامرة':'ابدأ المغامرة',44,'#3a2200',{style:{stroke:'#ffe9a8',strokeThickness:2}});
  this.tweens.add({targets:[btn,bt],scale:1.06,yoyo:true,repeat:-1,duration:600,ease:'Sine.inOut'});
  btn.on('pointerdown',()=>{this.snd('start');this.menu.destroy();this.menu=null;this.prog.seen?this.showMap():this.showStory('المغامرة بدأت',PROLOGUE,()=>{this.prog.seen=1;saveProg(this.prog);this.showMap()})});
  c.add([btn,bt]);
  {const n=this.prog.stars.reduce((a,b)=>a+b,0);c.add(this.txt(W/2,850,'النجوم: '+n+' / 15   ·   وصلت مرحلة '+Math.min(5,this.prog.unlocked),24,'#ffe27a'))}
  c.add(this.txt(W/2,905,'رسومات وأصوات: Kenney.nl (CC0)',18,'#bcd',{style:{strokeThickness:2}}));
  this.keys.SPACE=this.input.keyboard.addKey('SPACE');
 }
 showStory(title,text,cb,btnLabel){
  const c=this.card=this.add.container(0,0).setDepth(6200);
  c.add(this.add.rectangle(W/2,H/2,W,H,0x04100a,.9));
  const me=this.add.sprite(W/2-60,250,'me').setScale(3).setRotation(-.3);
  const gh=this.add.sprite(W/2+70,270,SKINS[(this.lvIdx||0)%6]).setScale(3).setTint(0xff7ad9).setAlpha(.6).setRotation(Math.PI+.4);
  this.tweens.add({targets:gh,y:'+=14',yoyo:true,repeat:-1,duration:900,ease:'Sine.inOut'});
  c.add([me,gh]);
  c.add(this.txt(W/2,390,title,52,'#ffe27a',{style:{wordWrap:{width:W-60},align:'center'}}));
  c.add(this.txt(W/2,540,text,30,'#ffffff',{style:{wordWrap:{width:W-90},align:'center',lineSpacing:12}}));
  const b=this.add.rectangle(W/2,780,330,96,0xffc93a).setStrokeStyle(6,0x8a5a00).setInteractive({useHandCursor:true});
  const bt=this.txt(W/2,780,btnLabel||'يلا!',46,'#3a2200',{style:{stroke:'#ffe9a8',strokeThickness:2}});
  this.tweens.add({targets:[b,bt],scale:1.06,yoyo:true,repeat:-1,duration:600,ease:'Sine.inOut'});
  b.on('pointerdown',()=>{this.snd('start');c.destroy();this.card=null;cb()});
  c.add([b,bt]);
 }
 showMap(){
  this.state='map';this.hud.setVisible(false);
  if(this.over){this.over.destroy();this.over=null}
  if(this.mapC){this.mapC.destroy()}
  const c=this.mapC=this.add.container(0,0).setDepth(6100);
  c.add(this.add.rectangle(W/2,H/2,W,H,0x0b2a1a,1));
  c.add(this.txt(W/2,90,'خريطة المغامرة',56,'#ffe27a'));
  const pos=[[W/2-110,780],[W/2+110,630],[W/2-110,480],[W/2+110,330],[W/2,190]];
  const g=this.add.graphics();g.lineStyle(10,0xffffff,.2);
  g.beginPath();g.moveTo(pos[0][0],pos[0][1]);for(let i=1;i<5;i++)g.lineTo(pos[i][0],pos[i][1]);g.strokePath();c.add(g);
  const tints=[0x66d36f,0xe6c06a,0x3f8f5a,0x8fcfff,0xb04a90];
  pos.forEach((p,i)=>{
   const open=i<this.prog.unlocked;
   const dot=this.add.circle(p[0],p[1],46,open?tints[i]:0x444444).setStrokeStyle(6,open?0xffffff:0x222222);
   c.add(dot);
   c.add(this.txt(p[0],p[1],String(i+1),44,open?'#ffffff':'#777777'));
   c.add(this.txt(p[0],p[1]+72,LEVELS[i].name,24,open?'#ffffff':'#888'));
   if(open){
    const st=this.prog.stars[i];
    c.add(this.txt(p[0],p[1]-70,'★'.repeat(st)+'☆'.repeat(3-st),30,'#ffd23a'));
    dot.setInteractive({useHandCursor:true});
    dot.on('pointerdown',()=>{this.snd('start');this.mapC.destroy();this.mapC=null;this.lvIdx=i;this.showStory('مرحلة '+(i+1)+': '+LEVELS[i].name,LEVELS[i].intro,()=>this.startLevel(i))});
    if(i===this.prog.unlocked-1&&!this.prog.done)this.tweens.add({targets:dot,scale:1.12,yoyo:true,repeat:-1,duration:600});
   }
  });
  const back=this.txt(70,H-40,'‹ رجوع',28,'#9ff0ff').setInteractive({useHandCursor:true});
  back.on('pointerdown',()=>{this.mapC.destroy();this.mapC=null;this.showMenu()});c.add(back);
 }
 startLevel(i){
  if(this.menu){this.menu.destroy();this.menu=null}
  if(this.over){this.over.destroy();this.over=null}
  this.buildLevel(i);
  this.ghosts.forEach(g=>this.killGhost(g));this.ghosts=[];this.recs=[];
  this.gems.forEach(g=>{g.s.destroy();g.gl.destroy()});this.gems=[];
  this.score=0;this.round=0;this.combo=0;this.lastCollect=-9999;this.lvGems=0;
  this.hud.setVisible(true);
  this.hScore.setText('النقاط: 0');this.updGoal();
  this.nextRound();
 }
 updGoal(){this.hGoal.setText(this.lvGems+' / '+this.lv.goal)}
 nextRound(){
  this.round++;this.rt=0;this.recNext=0;this.rec=[];this.state='play';
  this.vel.set(0,0);this.player.setPosition(START.x,START.y).setRotation(-Math.PI/2).setAlpha(1);
  this.ghosts.forEach(g=>this.killGhost(g));this.ghosts=[];
  if(this.recs.length>4)this.recs=this.recs.slice(-4);
  this.recs.forEach((r,i)=>this.spawnGhost(r,i));
  while(this.gems.length<6)this.spawnGem();
  this.hRound.setText('مرحلة '+(this.lvIdx+1)+' · جولة '+this.round);
  const n=this.recs.length;
  this.banner(n?(n===1?'شبحك ظهر! ابعد عنه':n+' أشباح وراك! اجري'):'ابدأ! حرّك صباعك',n?'#ff9bd9':'#9ff0ff');
  this.snd('tick',.5);
 }
 spawnGem(){
  const rnd=Phaser.Math.Between;let x,y,ok=false,t=0;
  while(!ok&&t++<80){
   x=rnd(PAD+30,W-PAD-30);y=rnd(PAD+90,H-PAD-50);
   ok=!this.obs.some(o=>Phaser.Math.Distance.Between(x,y,o.x,o.y)<o.r+34)&&Phaser.Math.Distance.Between(x,y,this.player.x,this.player.y)>110&&!this.gems.some(g=>Phaser.Math.Distance.Between(x,y,g.x,g.y)<80);
  }
  const gl=this.add.image(x,y,'dot').setTint(0x55d4ff).setAlpha(.35).setBlendMode('ADD').setScale(3).setDepth(y-2);
  const s=this.add.image(x,y,'gem').setTint(0x7fe3ff).setScale(.85).setDepth(y);
  this.tweens.add({targets:[s,gl],y:'-=6',yoyo:true,repeat:-1,duration:700+rnd(0,300),ease:'Sine.inOut'});
  this.tweens.add({targets:gl,alpha:.6,yoyo:true,repeat:-1,duration:600});
  s.setScale(0);this.tweens.add({targets:s,scale:.85,duration:250,ease:'Back.out'});
  this.gems.push({x,y,s,gl});
 }
 spawnGhost(rec,i){
  const col=TINTS[i%TINTS.length];
  const sh=this.add.ellipse(0,0,34,16,0,.25);
  const s=this.add.sprite(0,0,SKINS[i%SKINS.length]).setScale(1.8).setTint(col).setAlpha(.3);
  const aura=this.add.image(0,0,'dot').setTint(col).setAlpha(.25).setBlendMode('ADD').setScale(3.4);
  const em=this.add.particles(0,0,'dot',{follow:s,lifespan:500,frequency:70,scale:{start:.45,end:0},alpha:{start:.45,end:0},tint:col,blendMode:'ADD'});
  const g={rec,s,aura,sh,em,col,near:-9999};this.ghosts.push(g);this.placeGhost(g,0);
 }
 killGhost(g){g.s.destroy();g.aura.destroy();g.sh.destroy();g.em.destroy()}
 placeGhost(g,t){
  const r=g.rec,f=t/REC_DT,i=Math.min(Math.floor(f),r.length-1),j=Math.min(i+1,r.length-1),a=f-i;
  const p=r[i],q=r[j];
  g.x=p[0]+(q[0]-p[0])*a;g.y=p[1]+(q[1]-p[1])*a;g.rot=q[2];
  g.s.setPosition(g.x,g.y).setRotation(g.rot).setDepth(g.y+1);
  g.aura.setPosition(g.x,g.y).setDepth(g.y);g.sh.setPosition(g.x,g.y+14).setDepth(g.y-1);
 }
 banner(s,color){
  const t=this.txt(W/2,H/2-80,s,46,color).setDepth(3800).setScale(.4).setAlpha(0);
  this.tweens.add({targets:t,scale:1,alpha:1,duration:260,ease:'Back.out'});
  this.tweens.add({targets:t,alpha:0,y:H/2-130,delay:1100,duration:450,onComplete:()=>t.destroy()});
 }
 popup(x,y,s,color,size){
  const t=this.txt(x,y,s,size||26,color).setDepth(3700);
  this.tweens.add({targets:t,y:y-60,alpha:0,duration:800,ease:'Cubic.out',onComplete:()=>t.destroy()});
 }
 burst(x,y,col,n){
  const e=this.add.particles(x,y,'dot',{speed:{min:60,max:230},lifespan:520,scale:{start:.7,end:0},tint:col,blendMode:'ADD',emitting:false}).setDepth(3600);
  e.explode(n||14);this.time.delayedCall(700,()=>e.destroy());
 }
 // ---------- loop ----------
 update(time,delta){
  const p=this.player;
  this.pShadow.setPosition(p.x,p.y+16).setDepth(p.y-1);
  this.pAura.setPosition(p.x,p.y).setDepth(p.y-1);
  if(this.state==='menu'){return}
  if(this.state!=='play'){this.gfxJoy.clear();return}
  const dt=Math.min(delta,50)/1000;
  this.rt+=Math.min(delta,50);
  // input
  let ix=0,iy=0;const k=this.keys;
  if(k.LEFT.isDown||k.A.isDown)ix-=1;if(k.RIGHT.isDown||k.D.isDown)ix+=1;
  if(k.UP.isDown||k.W.isDown)iy-=1;if(k.DOWN.isDown||k.S.isDown)iy+=1;
  this.gfxJoy.clear();
  if(this.joy){
   let dx=this.joy.x-this.joy.ox,dy=this.joy.y-this.joy.oy;const R=70,len=Math.hypot(dx,dy);
   if(len>R){this.joy.ox+=dx/len*(len-R);this.joy.oy+=dy/len*(len-R);dx=this.joy.x-this.joy.ox;dy=this.joy.y-this.joy.oy}
   const l=Math.hypot(dx,dy);
   if(l>8){const m=Math.min(1,(l-8)/(R-8));ix=dx/l*m;iy=dy/l*m}
   this.gfxJoy.lineStyle(5,0xffffff,.35).strokeCircle(this.joy.ox,this.joy.oy,R);
   this.gfxJoy.fillStyle(0xffffff,.12).fillCircle(this.joy.ox,this.joy.oy,R);
   this.gfxJoy.fillStyle(0xffe27a,.75).fillCircle(this.joy.x-(this.joy.x-this.joy.ox>R?0:0),this.joy.y,30);
  }
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  const SP=250,ac=1-Math.pow(this.lv.ac,dt);
  this.vel.x+=(ix*SP-this.vel.x)*ac;this.vel.y+=(iy*SP-this.vel.y)*ac;
  p.x+=this.vel.x*dt;p.y+=this.vel.y*dt;
  p.x=Phaser.Math.Clamp(p.x,PAD+16,W-PAD-16);p.y=Phaser.Math.Clamp(p.y,PAD+20,H-PAD-20);
  for(const o of this.obs){
   const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy),min=o.r+13;
   if(d<min&&d>0){p.x=o.x+dx/d*min;p.y=o.y+dy/d*min}
  }
  const sp=this.vel.length();
  if(sp>25){const a=Math.atan2(this.vel.y,this.vel.x);p.rotation=Phaser.Math.Angle.RotateTo(p.rotation,a,dt*14);
   p.setTexture(Math.floor(time/130)%2?'me':'me2');p.setScale(1.8,1.8+Math.sin(time/60)*.07)}
  else{p.setTexture('me');p.setScale(1.8)}
  p.setDepth(p.y);
  // record
  while(this.recNext<=this.rt){this.rec.push([p.x,p.y,p.rotation]);this.recNext+=REC_DT}
  // ghosts
  const grace=this.rt<GRACE;let dead=false;
  for(const g of this.ghosts){
   this.placeGhost(g,this.rt);
   g.s.setAlpha(grace?.3:.78+Math.sin(time/150+g.col)*.12);
   g.aura.setAlpha(grace?.08:.28);
   if(grace)continue;
   const d=Math.hypot(g.x-p.x,g.y-p.y);
   if(d<20){dead=true;this.ghostHit=g;break}
   if(d<52&&time-g.near>1800){g.near=time;this.score+=25;this.popup(p.x,p.y-30,'قريبة! +25','#ff9bd9',28);this.snd('near',.5);this.buzz(20);this.updScore()}
  }
  if(dead){this.die();return}
  // gems
  for(let i=this.gems.length-1;i>=0;i--){
   const g=this.gems[i];
   if(Math.hypot(g.x-p.x,g.y-p.y)<34){
    this.combo=(time-this.lastCollect<2500)?Math.min(8,this.combo+1):1;this.lastCollect=time;
    const pts=10*this.combo;this.score+=pts;
    this.popup(g.x,g.y-20,'+'+pts+(this.combo>1?'  x'+this.combo:''),'#ffe27a',24+this.combo*2);
    this.burst(g.x,g.y,0x66e0ff,14);this.snd('collect',.55);this.buzz(12);
    g.s.destroy();g.gl.destroy();this.gems.splice(i,1);this.spawnGem();this.updScore();this.lvGems++;this.updGoal();
    if(this.lvGems>=this.lv.goal){this.levelWin();return}
   }
  }
  if(this.combo>1&&time-this.lastCollect>2500)this.combo=0;
  this.hCombo.setText(this.combo>1?'كومبو x'+this.combo:'');
  const fr=1-this.rt/ROUND_MS;
  this.hBar.setScale(Math.max(0,fr),1);
  this.hBar.setFillStyle(fr>.33?0x7dffb0:0xff6b6b);
  if(this.rt>=ROUND_MS)this.roundClear();
 }
 updScore(){this.hScore.setText('النقاط: '+this.score);this.tweens.add({targets:this.hScore,scale:1.2,yoyo:true,duration:90})}
 roundClear(){
  this.state='between';this.joy=null;this.gfxJoy.clear();
  this.recs.push(this.rec);
  const b=50*this.round;this.score+=b;this.updScore();
  this.snd('clear',.7);this.buzz([30,40,30]);
  this.burst(this.player.x,this.player.y,0xffe27a,26);
  this.banner('عديتها! +'+b,'#7dffb0');
  this.ghosts.forEach(g=>{this.tweens.add({targets:g.s,alpha:0,duration:400})});
  this.time.delayedCall(1500,()=>{if(this.state==='between')this.nextRound()});
 }
 die(){
  this.state='dying';this.joy=null;this.gfxJoy.clear();
  const p=this.player;
  this.snd('die',.8);this.buzz([80,40,120]);
  this.cameras.main.shake(380,.02);this.cameras.main.flash(260,255,60,80);
  this.burst(p.x,p.y,0xff5577,30);
  this.tweens.add({targets:p,alpha:0,scale:2.2,duration:350});
  this.time.delayedCall(900,()=>this.showOver());
 }
 levelWin(){
  this.state='won';this.joy=null;this.gfxJoy.clear();
  this.snd('clear',.8);this.buzz([30,40,30,40,60]);
  this.burst(this.player.x,this.player.y,0xffe27a,40);
  this.ghosts.forEach(g=>{this.tweens.add({targets:g.s,alpha:0,duration:400})});
  const i=this.lvIdx,stars=this.round<=2?3:(this.round<=3?2:1);
  this.prog.stars[i]=Math.max(this.prog.stars[i],stars);
  const last=i===LEVELS.length-1;
  if(last)this.prog.done=true;else this.prog.unlocked=Math.max(this.prog.unlocked,i+2);
  saveProg(this.prog);
  this.time.delayedCall(1200,()=>{
   this.hud.setVisible(false);
   const c=this.over=this.add.container(0,0).setDepth(6000);
   c.add(this.add.rectangle(W/2,H/2,W,H,0x041a0e,.88));
   c.add(this.txt(W/2,170,last?'خلصت المغامرة!':'عديت المرحلة!',64,'#7dffb0'));
   c.add(this.txt(W/2,260,'★'.repeat(stars)+'☆'.repeat(3-stars),80,'#ffd23a'));
   c.add(this.txt(W/2,350,'النقاط: '+this.score+'   ·   جولات: '+this.round,28,'#9ff0ff'));
   c.add(this.txt(W/2,470,LEVELS[i].outro,30,'#ffffff',{style:{wordWrap:{width:W-90},align:'center',lineSpacing:12}}));
   const mk=(y,label,col,stroke,fn,tc)=>{
    const b=this.add.rectangle(W/2,y,380,86,col).setStrokeStyle(6,stroke).setInteractive({useHandCursor:true});
    const t=this.txt(W/2,y,label,36,tc,{style:{stroke:'#ffffff',strokeThickness:1}});
    b.on('pointerdown',fn);c.add([b,t]);
   };
   mk(650,last?'الخريطة':'المرحلة الجاية',0xffc93a,0x8a5a00,()=>{this.snd('start');if(last)this.showMap();else{this.over.destroy();this.over=null;const n=i+1;this.lvIdx=n;this.showStory('مرحلة '+(n+1)+': '+LEVELS[n].name,LEVELS[n].intro,()=>this.startLevel(n))}},'#3a2200');
   mk(750,'العب المرحلة تاني',0x7dd3ff,0x1a6a8a,()=>{this.snd('start');this.startLevel(i)},'#06293a');
   if(last)mk(850,'شارك إنجازك',0xff9bd9,0x8a2a6a,()=>this.share(),'#3a0a2a');
   this.shareNote=this.txt(W/2,925,'',20,'#7dffb0');c.add(this.shareNote);
   this.burst(W/2,260,0xffe27a,40);
  });
 }
 showOver(){
  this.state='over';this.hud.setVisible(false);
  const c=this.over=this.add.container(0,0).setDepth(6000);
  c.add(this.add.rectangle(W/2,H/2,W,H,0x1a0510,.84));
  c.add(this.txt(W/2,250,'لمسك شبحك!',70,'#ff7a9a'));
  c.add(this.txt(W/2,350,'مرحلة '+(this.lvIdx+1)+': '+this.lv.name,32,'#9ff0ff'));
  c.add(this.txt(W/2,450,'جمعت '+this.lvGems+' من '+this.lv.goal+' جوهرة',36,'#ffe27a'));
  c.add(this.txt(W/2,540,'جرّب تتحرك أكتر وتبعد عن مسارك القديم',26,'#ffffff',{style:{wordWrap:{width:W-90},align:'center'}}));
  const mk=(y,label,col,stroke,fn,tc)=>{
   const b=this.add.rectangle(W/2,y,360,88,col).setStrokeStyle(6,stroke).setInteractive({useHandCursor:true});
   const t=this.txt(W/2,y,label,38,tc,{style:{stroke:'#ffffff',strokeThickness:1}});
   b.on('pointerdown',fn);c.add([b,t]);
  };
  mk(700,'حاول تاني',0xffc93a,0x8a5a00,()=>{this.snd('start');this.startLevel(this.lvIdx)},'#3a2200');
  mk(810,'الخريطة',0x7dd3ff,0x1a6a8a,()=>{this.snd('start');this.showMap()},'#06293a');
 }
 share(){
  const url='https://mohamedelsayed16399-bit.github.io/ghost-yourself-game/';
  const text='خلصت مغامرة شبح نفسك كلها بـ '+this.prog.stars.reduce((a,b)=>a+b,0)+' نجمة من 15 👻 تقدر تعملها؟';
  if(navigator.share){navigator.share({text,url}).catch(()=>{});return}
  const full=text+' '+url;
  (navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()).then(()=>this.shareNote.setText('اتنسخت! ابعتها لصحابك'),()=>this.shareNote.setText(full));
 }
}
function boot(){
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#0b1a0f',
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  input:{activePointers:3},render:{antialias:true,roundPixels:false},scene:[Main]});
}
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('800 30px Cairo','شبح'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(boot,boot);
</script>
